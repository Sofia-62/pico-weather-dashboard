<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pico W Weather Station Dashboard</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --primary: #2c3e50;
            --secondary: #3498db;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
            --radius: 14px;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--primary);
        }

        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 30px 20px;
            text-align: center;
            box-shadow: var(--shadow);
        }

        header h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 600;
        }

        header p {
            margin-top: 8px;
            opacity: 0.9;
        }

        main {
            padding: 30px;
            max-width: 1400px;
            margin: auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(420px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 18px;
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 18px 40px rgba(0,0,0,0.12);
        }

        .card h2 {
            margin: 0 0 12px 0;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        iframe {
            width: 100%;
            height: 260px;
            border: none;
            border-radius: 10px;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
            color: #666;
        }

        footer strong {
            color: #2a5298;
        }
    </style>
</head>

<body>

<header>
    <h1>🌦️  Weather Station Dashboard</h1>
    <p>Real-time environmental monitoring </p>
</header>

<main>
    <div class="grid">

        <!-- Temperature -->
        <div class="card">
            <h2>🌡️ Temperature (°C)</h2>
            <iframe src="https://thingspeak.com/channels/3218142/charts/1?api_key=CD3R84AROYXS7HND&bgcolor=%23ffffff&color=%23e74c3c&dynamic=true&results=60&type=line"></iframe>
        </div>

        <!-- Humidity -->
        <div class="card">
            <h2>💧 Humidity (%)</h2>
            <iframe src="https://thingspeak.com/channels/3218142/charts/2?api_key=CD3R84AROYXS7HND&bgcolor=%23ffffff&color=%233498db&dynamic=true&results=60&type=line"></iframe>
        </div>

        <!-- Pressure -->
        <div class="card">
            <h2>🌬️ Air Pressure (hPa)</h2>
            <iframe src="https://thingspeak.com/channels/3218142/charts/3?api_key=CD3R84AROYXS7HND&bgcolor=%23ffffff&color=%232ecc71&dynamic=true&results=60&type=line"></iframe>
        </div>

        <!-- Wind Speed -->
        <div class="card">
            <h2>🍃 Wind Speed (rot/s)</h2>
            <iframe src="https://thingspeak.com/channels/3218142/charts/4?api_key=CD3R84AROYXS7HND&bgcolor=%23ffffff&color=%239b59b6&dynamic=true&results=60&type=line"></iframe>
        </div>

    </div>
</main>

<footer>
    <p>
        <strong>FSKM UMT</strong> | CSM3313 Internet of Things <br>
        Pico W Weather Monitoring System
    </p>
</footer>

</body>
</html>
